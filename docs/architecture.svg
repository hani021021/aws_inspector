<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470 680" width="1470" height="680" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>AWS Inspector Remediation Agent – how it works</title>
  <style>
    .h1 { font-size: 26px; font-weight: 700; fill: #111827; }
    .sub { font-size: 15px; fill: #4b5563; }
    .step { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .who { font-size: 12.5px; fill: #ffffff; opacity: 0.95; }
    .tx { font-size: 13.5px; fill: #1f2937; }
    .chip { font-size: 12px; font-weight: 600; }
    .num { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .h2 { font-size: 17px; font-weight: 700; fill: #111827; }
    .bt { font-size: 13.5px; font-weight: 700; fill: #111827; }
    .st { font-size: 12.5px; fill: #374151; }
    .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1470" height="680" fill="#ffffff"/>
  <text x="30" y="44" class="h1">AWS Inspector Remediation Agent — how it works</text>
  <text x="30" y="72" class="sub">Every vulnerability goes through the same five steps. People approve twice; everything else is automated.</text>

  <!-- 1 Detect -->
  <rect x="30" y="100" width="250" height="290" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <path d="M30,112 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v48 h-250 z" fill="#ea580c"/>
  <circle cx="58" cy="130" r="15" fill="#ffffff"/><text x="58" y="135" class="num" fill="#ea580c">1</text>
  <text x="82" y="128" class="step">Detect</text>
  <text x="82" y="147" class="who">Amazon Inspector</text>
  <text x="48" y="192" class="tx">Scans every image in</text>
  <text x="48" y="211" class="tx">Amazon ECR, continuously</text>
  <text x="48" y="240" class="tx">Finds vulnerable OS and</text>
  <text x="48" y="259" class="tx">npm packages and the</text>
  <text x="48" y="278" class="tx">versions that fix them</text>
  <rect x="45" y="345" width="220" height="28" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="155" y="364" class="chip" fill="#9a3412" text-anchor="middle">AWS-managed service</text>

  <!-- 2 Analyze & fix -->
  <rect x="320" y="100" width="250" height="290" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <path d="M320,112 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v48 h-250 z" fill="#4f46e5"/>
  <circle cx="348" cy="130" r="15" fill="#ffffff"/><text x="348" y="135" class="num" fill="#4f46e5">2</text>
  <text x="372" y="128" class="step">Analyze &amp; fix</text>
  <text x="372" y="147" class="who">AI agent (Claude Code)</text>
  <text x="338" y="192" class="tx">Reads the findings through</text>
  <text x="338" y="211" class="tx">an MCP server (read-only)</text>
  <text x="338" y="240" class="tx">Picks a safe fix version,</text>
  <text x="338" y="259" class="tx">following the remediation skill</text>
  <text x="338" y="288" class="tx">Opens one pull request</text>
  <text x="338" y="307" class="tx">with the reasoning</text>
  <rect x="335" y="345" width="220" height="28" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="445" y="364" class="chip" fill="#3730a3" text-anchor="middle">aws login · GitHub sign-in</text>

  <!-- 3 Approve -->
  <rect x="610" y="100" width="250" height="290" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <path d="M610,112 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v48 h-250 z" fill="#059669"/>
  <circle cx="638" cy="130" r="15" fill="#ffffff"/><text x="638" y="135" class="num" fill="#059669">3</text>
  <text x="662" y="128" class="step">Approve</text>
  <text x="662" y="147" class="who">You (human)</text>
  <text x="628" y="192" class="tx">Review the pull request</text>
  <text x="628" y="211" class="tx">on GitHub</text>
  <text x="628" y="240" class="tx">Merge it — that is the</text>
  <text x="628" y="259" class="tx">approval to deploy</text>
  <rect x="625" y="345" width="220" height="28" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="735" y="364" class="chip" fill="#047857" text-anchor="middle">human approval 1 of 2</text>

  <!-- 4 Build & push -->
  <rect x="900" y="100" width="250" height="290" rx="12" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <path d="M900,112 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v48 h-250 z" fill="#374151"/>
  <circle cx="928" cy="130" r="15" fill="#ffffff"/><text x="928" y="135" class="num" fill="#374151">4</text>
  <text x="952" y="128" class="step">Build &amp; push</text>
  <text x="952" y="147" class="who">GitHub Actions</text>
  <text x="918" y="192" class="tx">Builds the new image</text>
  <text x="918" y="221" class="tx">Pushes it to ECR as</text>
  <text x="918" y="240" class="tx">latest + commit hash</text>
  <text x="918" y="269" class="tx">Signs in to AWS without</text>
  <text x="918" y="288" class="tx">stored keys (OIDC)</text>
  <rect x="915" y="345" width="220" height="28" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="1025" y="364" class="chip" fill="#111827" text-anchor="middle">OIDC → short AWS session</text>

  <!-- 5 Clean up -->
  <rect x="1190" y="100" width="250" height="290" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <path d="M1190,112 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v48 h-250 z" fill="#ea580c"/>
  <circle cx="1218" cy="130" r="15" fill="#ffffff"/><text x="1218" y="135" class="num" fill="#ea580c">5</text>
  <text x="1242" y="128" class="step">Clean up</text>
  <text x="1242" y="147" class="who">AWS Step Functions</text>
  <text x="1208" y="192" class="tx">Waits until the new image</text>
  <text x="1208" y="211" class="tx">is scanned</text>
  <text x="1208" y="240" class="tx">E-mails you which old</text>
  <text x="1208" y="259" class="tx">images it wants to delete</text>
  <text x="1208" y="288" class="tx">You click “Yes” → deleted,</text>
  <text x="1208" y="307" class="tx">and the decision is logged</text>
  <rect x="1205" y="345" width="220" height="28" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1315" y="364" class="chip" fill="#047857" text-anchor="middle">human approval 2 of 2</text>

  <!-- arrows between steps -->
  <path d="M282,245 H316" class="arrow"/>
  <path d="M572,245 H606" class="arrow"/>
  <path d="M862,245 H896" class="arrow"/>
  <path d="M1152,245 H1186" class="arrow"/>

  <!-- loop back -->
  <path d="M1315,392 V430 H155 V396" class="arrow"/>
  <rect x="470" y="417" width="530" height="26" rx="13" fill="#ffffff"/>
  <text x="735" y="435" class="tx" text-anchor="middle" font-weight="600">Inspector confirms the old findings are closed — next round</text>

  <!-- security -->
  <text x="30" y="492" class="h2">Built-in safety</text>
  <rect x="30" y="508" width="335" height="135" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="48" y="536" class="bt">No stored secrets</text>
  <text x="48" y="560" class="st">You sign in with aws login, GitHub signs</text>
  <text x="48" y="579" class="st">in with OIDC. Every AWS session is</text>
  <text x="48" y="598" class="st">short-lived; no access keys exist.</text>

  <rect x="395" y="508" width="335" height="135" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="413" y="536" class="bt">Least privilege</text>
  <text x="413" y="560" class="st">The agent can only read. Each automated</text>
  <text x="413" y="579" class="st">step has its own minimal role — only one</text>
  <text x="413" y="598" class="st">of them can delete images.</text>

  <rect x="760" y="508" width="335" height="135" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="778" y="536" class="bt">Right account only</text>
  <text x="778" y="560" class="st">Every tool checks which AWS account it</text>
  <text x="778" y="579" class="st">is signed in to and refuses to run</text>
  <text x="778" y="598" class="st">anywhere else.</text>

  <rect x="1125" y="508" width="315" height="135" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="1143" y="536" class="bt">Production stays safe</text>
  <text x="1143" y="560" class="st">The image tagged “latest” is never</text>
  <text x="1143" y="579" class="st">deleted. If anything changed after</text>
  <text x="1143" y="598" class="st">your approval, nothing is deleted.</text>
</svg>
